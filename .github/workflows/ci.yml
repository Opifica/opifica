name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPIFICA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      OPIFICA_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make tools
      - run: make lint
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code -- gen/ internal/controller/store/db/ || (echo "Run 'make generate' and commit the result." && exit 1)
      - run: make test
      - run: make build
