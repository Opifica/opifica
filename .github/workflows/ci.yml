name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make tools
      - run: make lint
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code -- gen/ || (echo "Run 'make generate' and commit the result." && exit 1)
      - run: make test
      - run: make build
